# Logstash : envoie les événements du pipeline vers Elasticsearch
# Chaque étape écrit une ligne JSON dans logs/pipeline/*.jsonl.
# Ces données servent au dashboard de monitoring.

input {
  file {
    path => "/opt/scipulse/logs/*.jsonl"
    mode => "tail"
    start_position => "beginning"
    sincedb_path => "/usr/share/logstash/data/sincedb_monitoring"
    codec => "json"
  }
}

filter {
  # Utilise la date de l'événement
  date {
    match => ["timestamp", "ISO8601"]
    target => "@timestamp"
  }
  mutate {
    remove_field => ["log", "host", "event"]
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "scipulse-monitoring"
    document_id => "%{event_id}"
  }
}
